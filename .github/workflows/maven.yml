
name: Maven CI/CD

# Kích hoạt khi push hoặc pull request
on:
  push:
    branches: [ "main" ]

  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Lấy source code từ GitHub
      - name: Checkout source code
        uses: actions/checkout@v4

      # Bước 2: Cài đặt JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Bước 3: Build, chạy Unit Tests và đóng gói JAR
      - name: Build with Maven
        run: mvn -B clean test package

      # Bước 4: Upload file JAR lên GitHub
      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: discount-calculator-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7
